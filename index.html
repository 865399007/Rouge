<body>
<main class="game-frame" aria-label="末日小队游戏">
  <div id="game">
    <div class="hud" aria-label="战斗状态">
      <section class="vitals hud-panel">
        <div class="health-label"><span>生命值 <strong>Lv.<b id="level">1</b></strong></span><b id="health">100 / 100</b></div>
        <div class="bar"><i id="hp"></i></div>
        <div class="health-label"><span>战斗经验</span><b id="xp-label">0 / 18</b></div>
        <div class="bar xp"><i id="xp"></i></div>
      </section>
      <span id="wave" class="wave">生存 0 / 10 分钟</span>
      <div class="game-top">
        <details class="settings"><summary aria-label="游戏设置">⚙</summary><div class="settings-panel hud-panel"><button id="sound" aria-label="切换静音" aria-pressed="false">声音：开</button><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="35" aria-label="游戏音量"><button id="restart">↻ 重新开始</button></div></details>
        <button id="pause">Ⅱ 暂停</button>
      </div>
      <section id="skills" class="equipment hud-panel" aria-label="已装备技能"></section>
      <section class="stats hud-panel"><span>⚔ 攻击 <b id="damage">18</b></span><span>➶ 移速 <b id="speed">210</b></span><span>✦ 击败 <b id="kills">0</b></span></section>
    </div>
  </div>
