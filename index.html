<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="末日小队" />
    <meta name="theme-color" content="#302e26" />
    <title>末日小队 · 街区守夜</title>
    <link rel="icon" type="image/svg+xml" href="./assets/potato.svg" />
    <script type="module" src="./game.js?v=pickup-art-2"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-frame" aria-label="末日小队游戏">
      <div id="game" tabindex="-1">
        <button id="tower-upgrade" type="button" hidden></button>
        <div class="hud" aria-label="战斗状态">
          <section class="vitals" aria-label="角色状态">
            <div class="vitals-bars">
              <div class="health-label">
                <span
                  ><span id="job-name">守夜人</span>
                  <strong>LV.<b id="level">1</b></strong></span
                ><b id="health">100 / 100</b>
              </div>
              <div class="bar"><i id="hp"></i></div>
              <div class="health-label xp-label">
                <span>进化经验</span><b id="xp-label">0 / 24</b>
              </div>
              <div class="bar xp"><i id="xp"></i></div>
          <section
            id="skills"
            class="equipment"
            aria-label="已装备技能"
          ></section>
            </div>
          </section>
          <div class="mission-clock">
            <span class="eyebrow">街区守夜 / SURVIVE</span
            ><strong id="timer">00:00</strong
            ><span id="wave" class="wave">生存 0 / 10 分钟</span>
          </div>
          <div class="game-top">
            <details class="settings">
              <summary aria-label="游戏设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6m5 0h7M3 17h11m5 0h2"/><circle cx="11.5" cy="7" r="2.5"/><circle cx="16.5" cy="17" r="2.5"/></svg></summary>
              <div class="settings-panel hud-panel">
                <button id="sound" aria-label="切换静音" aria-pressed="false">
                  声音：开</button
                ><label for="volume">音量</label
                ><input
                  id="volume"
                  type="range"
                  min="0"
                  max="100"
                  value="35"
                  aria-label="游戏音量"
                /><button id="restart">↻ 重新开始</button>
              </div>
            </details>
            <button id="pause" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
          </div>
          <div id="boss-warning" aria-live="polite" hidden></div>
          <div class="action-pad">
            <aside id="tower-tools" aria-label="原地建造防御塔"></aside>
            <button
              id="roll"
              class="roll-button"
              type="button"
              aria-label="翻滚，冷却5秒，期间无敌，快捷键Shift"
            >
              <svg class="dodge-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 18h10M3 24h8M7 30h5" stroke-width="2.5" opacity=".65"/>
                  <path d="M13 33c5 8 18 10 26 1" stroke-width="2.5"/>
                  <path d="m34 33 7-3-1 7" stroke-width="2.5"/>
                  <path d="m29 17-8 5 6 5-8 5M22 22l-7 6M29 18l1 8 6 1" stroke-width="5"/>
                </g>
                <circle cx="34" cy="13" r="4.5" fill="currentColor"/>
              </svg>
            </button>
          </div>

          <section class="stats">
            <span>增伤 <b id="damage">0%</b></span
            ><span>移速 <b id="speed">210</b></span
            ><span>击败 <b id="kills">0</b></span>
          </section>
          <div class="controls-hint">
            <kbd>W A S D</kbd> 移动 <span>·</span> 自动攻击 <span>·</span>
            <kbd>SHIFT</kbd> 翻滚 <span>·</span> <kbd>SPACE</kbd> 暂停
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
